plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

repositories {
    mavenCentral()
    maven {
        name = 'Sponge'
        url = 'https://repo.spongepowered.org/repository/maven-public/'
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    compileOnly 'org.spongepowered:mixin:0.8.7'
    annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'
    // Compile against the exact Epic Fight API used by the Avalon compatibility bridge.
    // The dependency is compile-only and is never bundled into KTFR.
    compileOnly 'maven.modrinth:vu3NZ5Ma:8HHhJt6i'
}

// Gradle derives dependency variant compatibility from the consumer configuration.
// options.release=17 controls emitted bytecode, but NeoForge's compile dependencies
// must be resolved as Java 21 libraries.
configurations.named('compileClasspath') {
    attributes {
        attribute(org.gradle.api.attributes.java.TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 21)
    }
}

group = rootProject.group
version = rootProject.version

base {
    archivesName = 'ktfr-neoforge-1.21.1'
}

// The universal archive is loaded on Java 17 (Forge 1.20.1) or Java 21
// (NeoForge 1.21.1). Keep this module's bytecode Java 17-compatible while
// compiling against the Java 21 Minecraft toolchain.
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    // Gradle resolves Minecraft/NeoForge dependencies against the compiler target.
    // Keep that target at 21; options.release below still emits Java 17 bytecode.
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

neoForge {
    version = '21.1.267'

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        kaisterstweaksandfixesreforged {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

// Keep the mod's own logo available when building the NeoForge payload alone.
tasks.named('processResources', ProcessResources).configure {
    from(rootProject.file('src/main/resources/KaistersTweaksandFixesReforged_icon.png'))
}
