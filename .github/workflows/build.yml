name: Build Universal JAR

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "logs/**"
  pull_request:
    paths-ignore:
      - "logs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ktfr-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Forge 1.20.1 + NeoForge 1.21.1
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Inspect bundled compatibility bytecode
        shell: bash
        run: |
          set -euo pipefail
          echo '===== SPORE SRP: EnvironmentEffectsHandler ====='
          javap -classpath revision/sporesrp-1.11.1-neo -p -c -s com.maha_fish.sporesrp.client.EnvironmentEffectsHandler
          echo '===== BALM CONFIG API ====='
          for cls in \
            net.blay09.mods.balm.api.config.LoadedConfig \
            net.blay09.mods.balm.api.config.MutableLoadedConfig \
            net.blay09.mods.balm.api.network.ConfigReflection \
            net.blay09.mods.balm.common.config.AbstractBalmConfig \
            net.blay09.mods.balm.neoforge.config.NeoForgeBalmConfig; do
            echo "--- $cls ---"
            javap -classpath revision/balm-neoforge-1.21.1-21.0.67 -p -c -s "$cls"
          done
          echo '===== CLIENT TWEAKS CONFIG ====='
          javap -classpath revision/clienttweaks-neoforge-1.21.1-21.1.15 -p -c -s net.blay09.mods.clienttweaks.ClientTweaksConfig
          echo '===== AVALON REFERENCES TO OLD EPIC FIGHT RENDERER EVENT ====='
          while IFS= read -r classfile; do
            rel="${classfile#revision/epic_fight_avalon-neoforge1.21.1-21.12.6.2/}"
            cls="${rel%.class}"
            cls="${cls//\//.}"
            echo "--- $cls ---"
            javap -classpath revision/epic_fight_avalon-neoforge1.21.1-21.12.6.2 -p -c -s "$cls"
          done < <(grep -R -a -l 'PatchedRenderersEvent' revision/epic_fight_avalon-neoforge1.21.1-21.12.6.2/com --include='*.class' || true)

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build both loader payloads and assemble universal JAR
        run: bash ./gradlew --no-daemon clean universalJar

      - name: Verify universal JAR metadata, entrypoints, Mixin classes, and refmaps
        shell: bash
        run: |
          set -euo pipefail
          jar_path=$(find build/libs -maxdepth 1 -name '*-universal.jar' -print -quit)
          test -n "$jar_path"
          jar tf "$jar_path" > /tmp/ktfr-jar-contents.txt

          required_entries=(
            "META-INF/mods.toml"
            "META-INF/neoforge.mods.toml"
            "KaistersTweaksandFixesReforged_icon.png"
            "kaisterstweaksandfixesreforged.mixins.json"
            "kaisterstweaksandfixesreforged.refmap.json"
            "kaisterstweaksandfixesreforged.neoforge.mixins.json"
            "kaisterstweaksandfixesreforged.neoforge.refmap.json"
            "br/kaister/kaisterstweaksandfixesreforged/KaistersTweaksAndFixesReforged.class"
            "br/kaister/kaisterstweaksandfixesreforged/neoforge/KTFRNeoForge.class"
            "br/kaister/kaisterstweaksandfixesreforged/mixin/CompatibilityMixinPlugin.class"
            "br/kaister/kaisterstweaksandfixesreforged/mixin/neoforge/sporesrp/EnvironmentEffectsHandlerMixin.class"
            "br/kaister/kaisterstweaksandfixesreforged/mixin/neoforge/nightfall/YamatoDodgeMixin.class"
            "br/kaister/kaisterstweaksandfixesreforged/neoforge/NightfallSkillData.class"
            "yesman/epicfight/api/client/neoevent/PrepareModelEvent.class"
          )

          for entry in "${required_entries[@]}"; do
            grep -Fxq "$entry" /tmp/ktfr-jar-contents.txt || {
              echo "Missing required JAR entry: $entry"
              exit 1
            }
          done

          python3 - "$jar_path" <<'PY'
          import json
          import sys
          import zipfile

          jar_path = sys.argv[1]
          configs = (
              "kaisterstweaksandfixesreforged.mixins.json",
              "kaisterstweaksandfixesreforged.neoforge.mixins.json",
          )

          with zipfile.ZipFile(jar_path) as jar:
              entries = set(jar.namelist())
              for config_name in configs:
                  config = json.loads(jar.read(config_name))
                  package = config["package"].replace(".", "/").rstrip("/")
                  mixins = config.get("mixins", []) + config.get("client", [])
                  for mixin in mixins:
                      class_path = f"{package}/{mixin.replace('.', '/')}.class"
                      if class_path not in entries:
                          raise SystemExit(
                              f"{config_name} registers missing class: {class_path}"
                          )
                  refmap = config.get("refmap")
                  if not refmap or refmap not in entries:
                      raise SystemExit(
                          f"{config_name} references missing refmap: {refmap}"
                      )
          print("All registered Mixin classes and both refmaps are present.")
          PY

          mod_version=$(sed -n 's/^mod_version=//p' gradle.properties)
          test -n "$mod_version"
          for metadata in META-INF/mods.toml META-INF/neoforge.mods.toml; do
            unzip -p "$jar_path" "$metadata" | grep -Fq "version=\"$mod_version\""
            unzip -p "$jar_path" "$metadata" | grep -Fq 'logoFile="KaistersTweaksandFixesReforged_icon.png"'
          done

          unzip -p "$jar_path" META-INF/MANIFEST.MF | grep -Fq "MixinConfigs: kaisterstweaksandfixesreforged.mixins.json"

      - name: Stage universal JAR
        shell: bash
        run: |
          mkdir -p dist
          shopt -s nullglob
          jars=(build/libs/*-universal.jar)
          test "${#jars[@]}" -eq 1
          test -s "${jars[0]}"
          cp "${jars[0]}" "dist/$(basename "${jars[0]}")"

      - name: Upload universal JAR
        uses: actions/upload-artifact@v4
        with:
          name: KTFR-Multiloader-Universal-Forge-1.20.1-NeoForge-1.21.1
          path: dist/*.jar
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
