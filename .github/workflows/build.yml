name: Build JAR

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ktfr-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Forge 1.20.1 JAR
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build and reobfuscate
        run: bash ./gradlew --no-daemon clean build

      - name: Stage JAR for download
        shell: bash
        run: |
          test -s build/reobfJar/output.jar
          mkdir -p dist
          cp build/reobfJar/output.jar "dist/KTFR-Forge-1.20.1-${GITHUB_SHA::7}.jar"

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: KTFR-Forge-1.20.1
          path: dist/*.jar
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
