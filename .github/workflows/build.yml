name: Build Universal JAR

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ktfr-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Forge 1.20.1 + NeoForge 1.21.1
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build both loader payloads and assemble universal JAR
        run: bash ./gradlew --no-daemon clean universalJar

      - name: Stage universal JAR
        shell: bash
        run: |
          mkdir -p dist
          shopt -s nullglob
          jars=(build/libs/*-universal.jar)
          test "${#jars[@]}" -eq 1
          test -s "${jars[0]}"
          cp "${jars[0]}" "dist/KTFR-Universal-Forge-1.20.1-NeoForge-1.21.1-${GITHUB_SHA::7}.jar"

      - name: Upload universal JAR
        uses: actions/upload-artifact@v4
        with:
          name: KTFR-Universal-Forge-1.20.1-NeoForge-1.21.1
          path: dist/*.jar
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
