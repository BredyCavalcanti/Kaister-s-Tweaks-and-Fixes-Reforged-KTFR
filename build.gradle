plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

group = 'br.kaister.kaisterstweaksandfixesreforged'
version = providers.gradleProperty('mod_version').get()

base {
    archivesName = "KTFR"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                kaisterstweaksandfixesreforged {
                    source sourceSets.main
                }
            }
        }
        client {}
        server { args '--nogui' }
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'Sponge'
        url = 'https://repo.spongepowered.org/repository/maven-public/'
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.10'
    // Compile-time only; Simple Storage Network is not bundled.
    compileOnly fg.deobf(files('libs/SimpleStorageNetwork-1.20.1-1.13.2.jar'))
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

mixin {
    add sourceSets.main, 'kaisterstweaksandfixesreforged.refmap.json'
    config 'kaisterstweaksandfixesreforged.mixins.json'
}

tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title'    : "Kaister's Tweaks & Fixes Reforged",
            'Specification-Vendor'   : 'Kaister',
            'Specification-Version'  : '1',
            'Implementation-Title'   : project.name,
            'Implementation-Version' : project.version,
            'Implementation-Vendor'  : 'Kaister',
            'MixinConfigs'           : 'kaisterstweaksandfixesreforged.mixins.json'
        ])
    }
    finalizedBy 'reobfJar'
}

// One distributable archive containing the Forge 1.20.1 payload and the
// NeoForge 1.21.1 payload. Loader-specific metadata and entrypoints remain
// separate; both loaders must be tested against this exact output.
tasks.register('universalJar', Jar) {
    group = 'build'
    description = 'Assembles the single distributable JAR for Forge 1.20.1 and NeoForge 1.21.1.'

    dependsOn 'reobfJar', ':neoforge:jar'

    archiveBaseName = "KTFR"
    archiveVersion = project.version
    archiveClassifier = 'multiloader-universal'

    manifest {
        attributes([
            'Specification-Title'   : "Kaister's Tweaks & Fixes Reforged",
            'Specification-Vendor'  : 'Kaister',
            'Specification-Version' : '1',
            'Implementation-Title'  : project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor' : 'Kaister',
            'MixinConfigs'          : 'kaisterstweaksandfixesreforged.mixins.json,kaisterstweaksandfixesreforged.neoforge.mixins.json'
        ])
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from({ zipTree(layout.buildDirectory.file('reobfJar/output.jar').get().asFile) })
    from({
        zipTree(project(':neoforge').tasks.named('jar').get().archiveFile.get().asFile)
    }) {
        exclude 'META-INF/MANIFEST.MF'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
